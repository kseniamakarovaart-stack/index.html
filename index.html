<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=2.0">
<title>Исправь ошибки Незнайки</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    font-family: 'Segoe UI', Tahoma, sans-serif;
    background: linear-gradient(135deg, #fdfbfb 0%, #ebedee 100%);
    margin: 0;
    padding: 12px;
    color: #333;
    min-height: 100vh;
  }
  .container {
    max-width: 800px;
    margin: 0 auto;
    background: #fff;
    border-radius: 18px;
    padding: 18px 14px 24px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.1);
  }
  h1 {
    text-align: center;
    color: #e74c3c;
    margin: 0 0 8px;
    font-size: 22px;
  }
  .intro {
    text-align: center;
    font-size: 14px;
    color: #555;
    margin: 0 0 16px;
    line-height: 1.5;
  }
  .word-row {
    display: flex;
    align-items: center;
    margin-bottom: 12px;
    background: #f8f9fa;
    padding: 10px 10px 10px 12px;
    border-radius: 12px;
    border-left: 5px solid #e74c3c;
    gap: 6px;
  }
  .word-label {
    font-weight: 700;
    color: #7f8c8d;
    min-width: 28px;
    font-size: 14px;
  }
  .word-content {
    font-size: 26px;
    line-height: 1.2;
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    flex: 1;
    gap: 1px;
  }
  .word-content span.letter-text {
    display: inline-block;
    min-width: 14px;
    text-align: center;
  }
  /* Поле ввода — теперь contenteditable div, а не input */
  .letter-box {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 40px;
    height: 48px;
    font-size: 28px;
    font-weight: 700;
    line-height: 1;
    text-align: center;
    border: 3px dashed #bdc3c7;
    border-radius: 8px;
    margin: 0 2px;
    background: #fff;
    color: #2c3e50;
    outline: none;
    transition: border-color 0.2s, background 0.2s;
    vertical-align: middle;
    overflow: hidden;
    user-select: text;
    -webkit-user-select: text;
  }
  .letter-box:focus {
    border-color: #3498db;
    background: #eaf4fc;
    border-style: solid;
  }
  .letter-box.correct {
    border-color: #2ecc71;
    background: #eafaf1;
    color: #1e8449;
  }
  .letter-box.wrong {
    border-color: #e74c3c;
    background: #fdecea;
    color: #c0392b;
  }
  .letter-box.upper {
    text-transform: uppercase;
  }
  .buttons {
    text-align: center;
    margin-top: 22px;
  }
  button {
    font-size: 17px;
    padding: 14px 26px;
    border: none;
    border-radius: 12px;
    cursor: pointer;
    margin: 4px;
    font-weight: 600;
    transition: transform 0.1s;
  }
  button:active { transform: scale(0.97); }
  .btn-check {
    background: #2ecc71;
    color: #fff;
    box-shadow: 0 4px 10px rgba(46, 204, 113, 0.4);
  }
  .btn-reset {
    background: #ecf0f1;
    color: #555;
  }
  #result {
    margin-top: 20px;
    padding: 16px;
    border-radius: 12px;
    font-size: 16px;
    text-align: center;
    display: none;
    line-height: 1.6;
  }
  #result.success { background: #d4edda; color: #155724; border: 2px solid #c3e6cb; }
  #result.partial { background: #fff3cd; color: #856404; border: 2px solid #ffeeba; }
  #result.fail { background: #f8d7da; color: #721c24; border: 2px solid #f5c6cb; }
  .correct-answer { font-weight: 700; color: #2980b9; }
  .tip { font-size: 13px; color: #7f8c8d; margin-top: 10px; text-align: center; }
</style>
</head>
<body>
<div class="container">
  <h1>🕵️ Исправь ошибки Незнайки</h1>
  <p class="intro">Впиши только <b>«опасные» буквы</b>.<br>
  Названия городов и стран — с <b>большой буквы</b>!</p>

  <div id="words-container"></div>

  <div class="buttons">
    <button class="btn-check" onclick="checkAnswers()">✅ Проверить</button>
    <button class="btn-reset" onclick="resetGame()">🔄 Заново</button>
  </div>

  <div id="result"></div>
  <p class="tip">Буква сразу подсвечивается: зелёным — верно, красным — ошибка.</p>
</div>

<script>
  const tasks = [
    { word: "ребята",        risky: [1] },
    { word: "девочка",       risky: [1] },
    { word: "мальчик",       risky: [2] },
    { word: "дежурный",      risky: [1] },
    { word: "товарищ",       risky: [4] },
    { word: "ученица",       risky: [2] },
    { word: "учительница",   risky: [6] },
    { word: "народ",         risky: [1] },
    { word: "директор",      risky: [1] },
    { word: "рабочий",       risky: [3] },
    { word: "библиотека",    risky: [1] },
    { word: "класс",         risky: [3] },
    { word: "алфавит",       risky: [1] },
    { word: "альбом",        risky: [2] },
    { word: "пенал",         risky: [1] },
    { word: "тетрадь",       risky: [2, 6] },
    { word: "карандаш",      risky: [1, 5] },
    { word: "рисунок",       risky: [1, 4] },
    { word: "картина",       risky: [1, 4] },
    { word: "русский",       risky: [2] },
    { word: "язык",          risky: [1] },
    { word: "Россия",        risky: [0, 2] },
    { word: "Москва",        risky: [0] },
    { word: "столица",       risky: [2] },
    { word: "город",         risky: [1] },
    { word: "Кремль",        risky: [0, 4] },
    { word: "Красная площадь", risky: [0, 8] },
    { word: "улица",         risky: [1] },
    { word: "адрес",         risky: [0] },
    { word: "аллея",         risky: [1, 2] },
    { word: "завод",         risky: [1, 4] },
    { word: "завтрак",       risky: [1, 4] },
    { word: "обед",          risky: [0, 3] },
    { word: "ужин",          risky: [1] },
    { word: "посуда",        risky: [1] },
    { word: "тарелка",       risky: [1, 4] },
    { word: "стакан",        risky: [1, 4] },
    { word: "кастрюля",      risky: [1, 5] },
    { word: "компот",        risky: [1, 5] },
    { word: "песок",         risky: [1, 3] },
    { word: "сахар",         risky: [1, 3] },
    { word: "дорога",        risky: [1, 4] },
    { word: "машина",        risky: [1, 4] },
    { word: "автобус",       risky: [0, 3, 6] },
    { word: "автомобиль",    risky: [0, 3, 5] },
    { word: "трамвай",       risky: [1, 5] },
    { word: "шоссе",         risky: [1, 2] },
    { word: "метро",         risky: [1, 4] },
    { word: "шофёр",         risky: [1] },
    { word: "билет",         risky: [1, 4] },
    { word: "вагон",         risky: [1, 4] },
    { word: "вокзал",        risky: [1, 4] },
    { word: "пассажир",      risky: [1, 2] }
  ];

  let currentTasks = [];

  function renderGame() {
    const container = document.getElementById('words-container');
    container.innerHTML = '';
    currentTasks = [...tasks].sort(() => Math.random() - 0.5).slice(0, 15);

    currentTasks.forEach((task, idx) => {
      const row = document.createElement('div');
      row.className = 'word-row';

      const label = document.createElement('span');
      label.className = 'word-label';
      label.textContent = (idx + 1) + '.';
      row.appendChild(label);

      const content = document.createElement('div');
      content.className = 'word-content';

      const riskySet = new Set(task.risky);

      for (let i = 0; i < task.word.length; i++) {
        if (riskySet.has(i)) {
          const correctChar = task.word[i];
          const box = document.createElement('div');
          box.className = 'letter-box' + (i === 0 ? ' upper' : '');
          box.setAttribute('contenteditable', 'true');
          box.setAttribute('inputmode', 'text');
          box.setAttribute('autocapitalize', i === 0 ? 'characters' : 'none');
          box.setAttribute('autocorrect', 'off');
          box.setAttribute('spellcheck', 'false');
          box.dataset.word = task.word;
          box.dataset.index = i;
          box.dataset.correct = correctChar;

          box.addEventListener('input', function() {
            // Оставляем только одну букву
            let text = this.textContent.replace(/[^a-zA-Zа-яА-ЯёЁ]/g, '');
            if (text.length > 1) {
              text = text.slice(-1); // берём последнюю введённую
            }
            this.textContent = text;
            // Переставляем курсор в конец
            const range = document.createRange();
            const sel = window.getSelection();
            range.selectNodeContents(this);
            range.collapse(false);
            sel.removeAllRanges();
            sel.addRange(range);

            // Автопроверка
            this.classList.remove('correct', 'wrong');
            if (!text) return;
            const isLetterOk = text.toLowerCase() === correctChar.toLowerCase();
            const isCaseOk = (correctChar === correctChar.toLowerCase())
              ? (text === text.toLowerCase())
              : (text === text.toUpperCase());
            if (isLetterOk && isCaseOk) {
              this.classList.add('correct');
            } else {
              this.classList.add('wrong');
            }
          });

          // Запрет вставки и Enter
          box.addEventListener('keydown', function(e) {
            if (e.key === 'Enter') e.preventDefault();
            if (e.key === 'Backspace' && this.textContent === '') e.preventDefault();
          });
          box.addEventListener('paste', function(e) {
            e.preventDefault();
          });

          content.appendChild(box);
        } else {
          const span = document.createElement('span');
          span.className = 'letter-text';
          span.textContent = task.word[i];
          content.appendChild(span);
        }
      }

      row.appendChild(content);
      container.appendChild(row);
    });
  }

  function checkAnswers() {
    const boxes = document.querySelectorAll('.letter-box');
    let total = 0, correctCount = 0;
    const wrongWords = new Set();

    const answers = {};
    boxes.forEach(box => {
      const w = box.dataset.word;
      if (!answers[w]) answers[w] = [];
      answers[w].push(box);
    });

    currentTasks.forEach(task => {
      const wordBoxes = answers[task.word];
      if (!wordBoxes || wordBoxes.length === 0) return;
      total++;
      let ok = true;
      wordBoxes.forEach(box => {
        const val = box.textContent.trim();
        const correct = box.dataset.correct;
        const isLetterOk = val.toLowerCase() === correct.toLowerCase();
        const isCaseOk = (correct === correct.toLowerCase())
          ? (val === val.toLowerCase())
          : (val === val.toUpperCase());
        if (!isLetterOk || !isCaseOk) ok = false;
      });
      if (ok) correctCount++;
      else wrongWords.add(task.word);
    });

    const resultDiv = document.getElementById('result');
    resultDiv.style.display = 'block';

    if (correctCount === total) {
      resultDiv.className = 'success';
      resultDiv.innerHTML = `🎉 <b>Молодец!</b> Все ${total} слов написаны без ошибок!`;
    } else {
      resultDiv.className = correctCount > total / 2 ? 'partial' : 'fail';
      let msg = `Правильно: <b>${correctCount}</b> из <b>${total}</b>.<br>`;
      msg += `Повтори эти слова:<br>` + Array.from(wrongWords).map(w => `<span class="correct-answer">${w}</span>`).join(', ');
      resultDiv.innerHTML = msg;
    }
  }

  function resetGame() {
    renderGame();
    document.getElementById('result').style.display = 'none';
    document.getElementById('result').className = '';
  }

  renderGame();
</script>
</body>
</html>
